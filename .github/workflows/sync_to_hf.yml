name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "aditya-ranjan1234@users.noreply.github.com"
          git config --global user.name "Aditya Ranjan"
          
          # We want to sync the CONTENTS of the huggingface_space folder to the HF repo
          # The easiest way is to clone the HF repo, copy files, and push
          git clone https://aditya-ranjan1234:$HF_TOKEN@huggingface.co/spaces/aditya-ranjan1234/foodsense-ai hf_space_repo
          cp -r huggingface_space/* hf_space_repo/
          cd hf_space_repo
          git add .
          git commit -m "Sync from GitHub Action: ${{ github.event.head_commit.message }}" || echo "No changes to commit"
          git push origin main
