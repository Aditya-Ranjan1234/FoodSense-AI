name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Error: HF_TOKEN secret is not set. Please add it to your GitHub repository secrets."
            exit 1
          fi
          
          git config --global user.email "aditya-ranjan1234@users.noreply.github.com"
          git config --global user.name "Aditya Ranjan"
          
          # Clone with the token in the URL for authentication
          git clone https://aditya-ranjan1234:$HF_TOKEN@huggingface.co/spaces/aditya-ranjan1234/foodsense-ai hf_space_repo
          
          # Sync the contents of huggingface_space to the repo
          cp -r huggingface_space/* hf_space_repo/
          
          cd hf_space_repo
          git add .
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync from GitHub: ${{ github.event.head_commit.message }}"
            git push origin main
          fi
