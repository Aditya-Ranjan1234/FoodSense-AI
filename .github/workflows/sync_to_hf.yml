name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is missing! Add it to GitHub Secrets."
            exit 1
          fi
          
          # Use the official huggingface-cli to upload the folder
          # This is much more reliable than raw git commands in Actions
          python -c "
          from huggingface_hub import HfApi
          import os
          
          api = HfApi(token=os.environ['HF_TOKEN'])
          
          print('Starting upload to aditya-ranjan1234/foodsense-ai...')
          api.upload_folder(
              folder_path='huggingface_space',
              repo_id='aditya-ranjan1234/foodsense-ai',
              repo_type='space',
              delete_patterns=['*']  # This ensures the Space matches your local folder exactly
          )
          print('Upload successful!')
          "
