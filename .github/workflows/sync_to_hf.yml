name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is missing! Please go to your Repo Settings > Secrets > Actions and add HF_TOKEN."
            exit 1
          fi
          
          python -c "
          from huggingface_hub import HfApi
          import os
          import sys
          
          try:
              api = HfApi(token=os.environ['HF_TOKEN'])
              user = api.whoami()
              print(f'Authenticated as: {user[\"name\"]}')
              
              print('Starting upload to aditya-ranjan1234/foodsense-ai...')
              api.upload_folder(
                  folder_path='huggingface_space',
                  repo_id='aditya-ranjan1234/foodsense-ai',
                  repo_type='space'
              )
              print('Upload successful!')
          except Exception as e:
              print(f'::error::Sync failed: {e}')
              sys.exit(1)
          "
