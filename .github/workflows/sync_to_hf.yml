name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is missing! Please ensure 'HF_TOKEN' is added to GitHub Secrets."
            exit 1
          fi
          
          # Setup git config
          git config --global user.email "aditya-ranjan1234@users.noreply.github.com"
          git config --global user.name "Aditya Ranjan"
          
          echo "Starting Sync Process..."
          
          # Use the token to clone the repository
          # We use a temporary directory to avoid conflicts
          git clone "https://aditya-ranjan1234:${HF_TOKEN}@huggingface.co/spaces/aditya-ranjan1234/foodsense-ai" hf_repo
          
          echo "Current files in huggingface_space/:"
          ls -la huggingface_space/
          
          # Copy files from our local repo's huggingface_space folder to the HF repo
          cp -rv huggingface_space/* hf_repo/
          
          cd hf_repo
          
          # Check for changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to sync. Everything is up to date."
          else
            echo "Changes detected. Committing..."
            git commit -m "Sync from GitHub: ${{ github.event.head_commit.message }}"
            
            echo "Pushing to Hugging Face..."
            # Force push to ensure the Space matches the GitHub folder exactly
            git push origin main --force
            echo "Sync complete!"
          fi
